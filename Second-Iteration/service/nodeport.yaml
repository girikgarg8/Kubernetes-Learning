apiVersion: v1
kind: Service
metadata:
  name: my-nodeport-service
spec:
  type: NodePort
  selector:
    app: nginx-deployment # the service now knows it has to load balance among pods with this label
  ports:
  - protocol: TCP
    port: 8080 # service port
    targetPort: 80 # pod container's port
    nodePort: 31000 # port on the node 