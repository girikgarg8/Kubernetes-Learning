apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memory-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stress-deployment
  minReplicas: 1
  maxReplicas: 5

  metrics:
    - type: Resource
      resource: 
        name: memory
        target:
          type: Utilization
          averageUtilization: 70